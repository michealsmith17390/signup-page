<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>FTC Safety Locker Signup</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    background:#eef4fb;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

}


.container{

    width:450px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);

}


h2{

    text-align:center;
    color:#004080;
    margin-bottom:20px;

}


label{

    display:block;
    margin-top:12px;
    margin-bottom:5px;
    font-weight:bold;

}


input,
textarea,
select{

    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:5px;
    font-size:15px;

}


textarea{

    resize:none;

}


button{

    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:6px;
    color:white;
    background:#0066cc;
    font-size:16px;
    cursor:pointer;

}
    .button-group{
    display:flex;
    gap:10px;
    margin-top:20px;
}

.button-group button{
    flex:1;
    margin-top:0;
}

.login-btn{
    background:#28a745;
}

.login-btn:hover{
    background:#218838;
}


button:hover{

    background:#004d99;

}


.message{

    margin-top:15px;
    padding:10px;
    border-radius:5px;
    text-align:center;
    display:none;

}


.success{

    background:#d4edda;
    color:#155724;

}


.error{

    background:#f8d7da;
    color:#721c24;

}


</style>

</head>


<body>


<div class="container">


<h2>Create FTC Safety Locker</h2>


<form id="signupForm">


<label>Full Name</label>
<input type="text" id="fullname" required>



<label>Phone Number</label>
<input type="tel" id="phone" required>



<label>Email Address</label>
<input type="email" id="email" required>



<label>Address</label>
<textarea id="address" rows="3" required></textarea>



<label>Date of Birth</label>
<input type="date" id="dob" required>



<label>Type of Account</label>

<select id="accountType" required>

<option value="">Select Account Type</option>

<option value="SafeGuard Account">
SafeGuard Account
</option>

</select>

<div class="button-group">
    <button type="submit">Create Account</button>

    <button type="button" id="loginBtn" class="login-btn">
        Log In
    </button>
</div>

<!--<button type="submit">
Create Account
</button>-->


</form>


<div id="message" class="message"></div>


</div>



<script type="module">


// Firebase imports

import { initializeApp } from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";


import { 
getFirestore,
collection,
addDoc
}
from 
"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";



// PASTE YOUR FIREBASE CONFIG HERE

const firebaseConfig = {
  apiKey: "AIzaSyBvXS7gsLMxnGvFjj6t0qvX5rTRU7xhmvY",
  authDomain: "ftc-locker-demo.firebaseapp.com",
  projectId: "ftc-locker-demo",
  storageBucket: "ftc-locker-demo.firebasestorage.app",
  messagingSenderId: "387689169940",
  appId: "1:387689169940:web:e7be28db6d7fe059449301",
  measurementId: "G-L39XCRERLS"
};



// Initialize Firebase

const app = initializeApp(firebaseConfig);

const db = getFirestore(app);





const form=document.getElementById("signupForm");

const message=document.getElementById("message");



form.addEventListener("submit", async function(e){


e.preventDefault();



const userData={


fullname:
document.getElementById("fullname").value,


phone:
document.getElementById("phone").value,


email:
document.getElementById("email").value,


address:
document.getElementById("address").value,


dob:
document.getElementById("dob").value,


accountType:
document.getElementById("accountType").value,


createdAt:
new Date()



};



try{


await addDoc(
collection(db,"users"),
userData
);



message.style.display="block";

message.className="message success";

message.innerHTML=
"✅ Account created successfully!";



form.reset();



setTimeout(function(){

window.location.href="account.html";

},2000);



}



catch(error){


console.log(error);



message.style.display="block";

message.className="message error";

message.innerHTML=
"❌ Error saving account";


}
    const loginBtn = document.getElementById("loginBtn");

loginBtn.addEventListener("click", function () {
    window.location.href = "login.html";
});



});



</script>


</body>

</html>
