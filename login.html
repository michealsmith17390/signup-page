<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Login</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;

    /* Background image */
    background-image:
        linear-gradient(rgba(0, 40, 80, 0.45), rgba(0, 20, 50, 0.55)),
        url("images.png");

    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

/* Login form */
.login-box {
    background: rgba(255, 255, 255, 0.92);
    width: 350px;
    padding: 30px;
    border-radius: 15px;

    /* Shadow makes the form stand out from image */
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.35);

    /* Glass effect */
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
}

h2 {
    text-align: center;
    color: #004080;
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 15px;
    font-weight: bold;
    color: #333;
}

input {
    width: 100%;
    padding: 12px;
    margin-top: 5px;
    border: 1px solid #ccc;
    border-radius: 6px;
    outline: none;
    font-size: 15px;
}

input:focus {
    border-color: #004080;
    box-shadow: 0 0 5px rgba(0, 64, 128, 0.25);
}

button {
    width: 100%;
    padding: 12px;
    margin-top: 20px;
    background: #004080;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
    font-weight: bold;
}

button:hover {
    background: #0059b3;
}

#error {
    margin-top: 15px;
    text-align: center;
    color: red;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="login-box">

    <h2>FTC Safety Locker</h2>

    <label for="username">Username</label>
    <input
        type="text"
        id="username"
        placeholder="Enter username"
    >

    <label for="password">Password</label>
    <input
        type="password"
        id="password"
        placeholder="Enter password"
    >

    <button onclick="login()">Login</button>

    <div id="error"></div>

</div>

<script>
function login() {

    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if (username === "locker1903" && password === "Ftc@2026") {

        window.location.href = "dashboard.html";

    } else {

        document.getElementById("error").innerHTML =
            "Invalid username or password.";

    }
}
</script>

</body>
</html>
